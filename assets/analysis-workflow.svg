<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Business analytics workflow</title><desc id="desc">Five-step workflow from data intake to decision-oriented insight.</desc>
<rect width="1000" height="300" rx="18" fill="#f8fafc"/><text x="44" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#12233f">Analysis workflow</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="35" y="92" width="165" height="120" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/><circle cx="117" cy="119" r="15" fill="#0369a1"/><text x="117" y="124" fill="#ffffff" font-size="14" font-weight="700">1</text><text x="117" y="157" fill="#0c4a6e" font-size="16" font-weight="700">Load data</text><text x="117" y="181" fill="#36566c" font-size="12">Inspect structure</text></g>
<g><rect x="230" y="92" width="165" height="120" rx="13" fill="#e0e7ff" stroke="#a5b4fc"/><circle cx="312" cy="119" r="15" fill="#4338ca"/><text x="312" y="124" fill="#ffffff" font-size="14" font-weight="700">2</text><text x="312" y="157" fill="#312e81" font-size="16" font-weight="700">Clean</text><text x="312" y="181" fill="#4b4d77" font-size="12">Validate records</text></g>
<g><rect x="425" y="92" width="165" height="120" rx="13" fill="#d1fae5" stroke="#6ee7b7"/><circle cx="507" cy="119" r="15" fill="#047857"/><text x="507" y="124" fill="#ffffff" font-size="14" font-weight="700">3</text><text x="507" y="157" fill="#065f46" font-size="16" font-weight="700">Engineer</text><text x="507" y="181" fill="#35685a" font-size="12">Create useful KPIs</text></g>
<g><rect x="620" y="92" width="165" height="120" rx="13" fill="#fef3c7" stroke="#fcd34d"/><circle cx="702" cy="119" r="15" fill="#b45309"/><text x="702" y="124" fill="#ffffff" font-size="14" font-weight="700">4</text><text x="702" y="157" fill="#78350f" font-size="16" font-weight="700">Analyse</text><text x="702" y="181" fill="#795a31" font-size="12">Compare segments</text></g>
<g><rect x="815" y="92" width="150" height="120" rx="13" fill="#ccfbf1" stroke="#5eead4"/><circle cx="890" cy="119" r="15" fill="#0f766e"/><text x="890" y="124" fill="#ffffff" font-size="14" font-weight="700">5</text><text x="890" y="157" fill="#134e4a" font-size="16" font-weight="700">Communicate</text><text x="890" y="181" fill="#35685a" font-size="12">Explain decisions</text></g></g>
<g stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M202 152H222l-7 -6m7 6l-7 6"/><path d="M397 152H417l-7 -6m7 6l-7 6"/><path d="M592 152H612l-7 -6m7 6l-7 6"/><path d="M787 152H807l-7 -6m7 6l-7 6"/></g>
<text x="44" y="256" font-family="Arial,sans-serif" font-size="13" fill="#64748b">A transparent workflow makes the analysis easier to review, reproduce and extend.</text>
</svg>